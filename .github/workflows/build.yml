name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: store
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Make gradlew executable
        run: chmod +x ./store-main/gradlew
      
      - name: Build with Gradle
        run: |
          cd store-main
          ./gradlew build -x test
      
      - name: Run Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/store
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin
        run: |
          cd store-main
          ./gradlew test
      
      - name: Generate Test Report
        if: always()
        run: |
          cd store-main
          ./gradlew jacocoTestReport
      
      - name: Upload Coverage Reports
        if: always()
        uses: codecov/codecov-action@v3
        with:
          directory: ./store-main/build/reports/jacoco/test/html
          flags: unittests
          fail_ci_if_error: false
      
      - name: Code Quality - Spotless Check
        run: |
          cd store-main
          ./gradlew spotlessCheck
      
      - name: Build Docker Image
        if: success()
        run: |
          cd store-main
          docker build -f ../Dockerfile -t store-app:${{ github.sha }} .
          docker tag store-app:${{ github.sha }} store-app:latest
      
      - name: Push Docker Image (on main only)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          echo "Docker image would be pushed to registry here"
          echo "store-app:${{ github.sha }}"
      
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: store-main/build/libs/
          retention-days: 30
      
      - name: Comment PR with Test Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testReportPath = './store-main/build/test-results/test/index.html';
            if (fs.existsSync(testReportPath)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ Tests passed. See artifacts for detailed reports.'
              });
            }
